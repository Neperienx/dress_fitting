<!DOCTYPE html>
<html lang="$html_lang">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>$page_title</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-content">
        <a class="brand" href="/" aria-label="Go to the Bridal Studio Sessions landing page">
          <span class="brand-mark">✦</span>
          <span class="brand-name">Bridal Studio Sessions</span>
        </a>
        <div class="header-actions">
          <div class="settings-menu" data-settings-menu>
            <button class="settings-menu-trigger" type="button" aria-label="Open settings" data-settings-menu-trigger>
              ⚙
            </button>
            <div class="settings-menu-panel is-hidden" data-settings-menu-panel>
              <p class="settings-menu-label">Language</p>
              <nav class="language-switcher">$language_switcher</nav>
            </div>
          </div>
          <a class="button secondary login-button" href="/stores">Stores</a>
          <a class="button login-button" href="/login" data-auth-login-link>Log in</a>
          <div class="user-menu is-hidden" data-user-menu>
            <button class="button user-menu-trigger" type="button" data-user-menu-trigger>
              <span data-user-menu-name></span>
            </button>
            <div class="user-menu-panel is-hidden" data-user-menu-panel>
              <button class="text-link user-menu-logout" type="button" data-auth-logout>
                Log out
              </button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main id="landing-root">$sections</main>
    <script src="/scripts/core/storage-adapter.js" defer></script>
    <script src="/scripts/auth/auth-storage.js" defer></script>
    <script src="/scripts/stores/stores-service.js" defer></script>
    <script src="/scripts/session/session-service.js" defer></script>
    <script src="/scripts/ai/ai-service.js" defer></script>
    <script src="/scripts/core/ui-utils.js" defer></script>
    <script src="/scripts/inventory/inventory-session-engine.js" defer></script>
    <script src="/scripts/inventory/inventory-api.js" defer></script>
    <script src="/scripts/auth-page.js" defer></script>
    <script src="/scripts/stores-page.js" defer></script>
    <script src="/app.js" defer></script>
  </body>
</html>
